<!DOCTYPE html>
<html>
<head>
    <title>Cultural Festival Registration</title>
</head>
<body>
    <h1 align="center">Cultural Festival Registration Form</h1>
    <form>
        <label>Full Name:</label><br>
        <input type="text" name="fullname">
        <br><br>
        <label>Email:</label><br>
        <input type="email" name="email">
        <br><br>
        <label>Phone Number:</label><br>
        <input type="tel" name="phone">
        <br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male">
        Male
        <input type="radio" name="gender" value="Female">
        Female
        <input type="radio" name="gender" value="Other">
        Other
        <br><br>
        <label>Select Events:</label><br>
        <input type="checkbox" name="events" value="Dance">
        Dance<br>
        <input type="checkbox" name="events" value="Singing">
        Singing<br>
        <input type="checkbox" name="events" value="Drama">
        Drama<br>
        <input type="checkbox" name="events" value="Photography">
        Photography<br>
        <input type="checkbox" name="events" value="Music">
        Music<br>
        <input type="checkbox" name="events" value="Fashion Show">
        Fashion Show<br>
        <input type="checkbox" name="events" value="Poetry Slam">
        Poetry Slam<br>
        <input type="checkbox" name="events" value="Art Exhibition">
        Art Exhibition<br>
        <input type="checkbox" name="events" value="Debate">
        Debate<br>
        <input type="checkbox" name="events" value="Quiz">
        Quiz
        <br><br>
        <label>Select Institution:</label><br>
        <select name="institution">
            <option value="">Select Institution</option>
            <option value="Jain University">Jain University</option>
            <option value="Bangalore University">Bangalore University</option>
            <option value="Christ University">Christ University</option>
            <option value="Other">Other</option>
        </select>
        <br><br>
        <label>Address:</label><br>
        <textarea name="address" rows="5" cols="30"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
